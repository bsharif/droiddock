name: Release

# Push a tag like v0.2.0 to build the app and publish a GitHub release.
# With the signing secrets set, the app is signed with a Developer ID and notarised.
# Without them, the release is unsigned and its notes explain how to open it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}            # Developer ID Application .p12, base64
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}  # password of the .p12
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}    # app-specific password
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $v" >&2
            exit 1
          fi

      - name: Signed or unsigned?
        run: |
          missing=""
          for s in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -z "$missing" ]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "All signing secrets are set: this release will be signed and notarised."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::Unsigned release. Missing secrets:$missing"
          fi

      - name: Import Developer ID certificate
        if: env.SIGNED == 'true'
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(openssl rand -hex 24)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$ID" ]; then echo "No 'Developer ID Application' identity in the certificate." >&2; exit 1; fi
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal app
        run: |
          if [ "$SIGNED" = "true" ]; then
            UNIVERSAL=1 ./packaging/build-app.sh --notarize --zip
          else
            UNIVERSAL=1 ./packaging/build-app.sh --zip
          fi

      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo ""
            echo "### Install"
            echo "1. \`brew install android-platform-tools\`"
            echo "2. Unzip, and move **DroidDock.app** to Applications."
            if [ "$SIGNED" = "true" ]; then
              echo "3. Open it. The app is signed with a Developer ID and notarised by Apple."
            else
              echo "3. This build is **not notarised**, so macOS blocks it the first time. Open it one time and close the warning. Then open **System Settings › Privacy & Security**, and click **Open Anyway**. Or run: \`xattr -dr com.apple.quarantine /Applications/DroidDock.app\`"
            fi
            echo ""
            echo "Universal app: Apple Silicon and Intel, macOS 14 or later."
            echo "Check the download: \`shasum -a 256 -c DroidDock-$GITHUB_REF_NAME-macos.zip.sha256\`"
          } >> notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DroidDock-*.zip dist/DroidDock-*.zip.sha256 \
            --title "DroidDock $GITHUB_REF_NAME" --notes-file notes.md
